<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>酒馆角色卡 & 世界书解析导出器</title>
    <!-- 引入 JSZip 用于打包压缩包 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --bg-color: #0f111a;
            --card-bg: #1a1d2d;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-color: #e2e8f0;
            --text-dim: #94a3b8;
            --border-color: #2e344e;
            --box-bg: #131522;
            --key-color: #10b981;
            --export-btn-bg: #10b981;
            --export-btn-hover: #059669;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        .header-title {
            text-align: center;
            margin-bottom: 20px;
        }

        .header-title h2 {
            margin: 0 0 8px 0;
            color: #ffffff;
            font-size: 1.5rem;
        }

        .header-title p {
            margin: 0;
            color: var(--text-dim);
            font-size: 0.85rem;
        }

        .upload-area {
            border: 2px dashed var(--accent-color);
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            background-color: var(--card-bg);
            cursor: pointer;
            margin-bottom: 20px;
            transition: all 0.2s ease;
        }

        .upload-area:active {
            transform: scale(0.98);
            background-color: #22263d;
        }

        .upload-icon {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .upload-text {
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .upload-hint {
            color: var(--text-dim);
            font-size: 0.8rem;
            line-height: 1.4;
        }

        .file-tip-box {
            background-color: rgba(99, 102, 241, 0.1);
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            padding: 10px 14px;
            margin-top: 12px;
            font-size: 0.78rem;
            color: #cbd5e1;
            text-align: left;
            line-height: 1.5;
        }

        input[type="file"] {
            display: none;
        }

        .display-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border-color);
            display: none;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .header-profile {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 16px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        @media (min-width: 600px) {
            .header-profile {
                flex-direction: row;
                text-align: left;
                align-items: flex-start;
            }
        }

        .avatar {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid var(--border-color);
            flex-shrink: 0;
            background-color: var(--box-bg);
        }

        .meta-info h1 {
            margin: 0 0 8px 0;
            color: #ffffff;
            font-size: 1.4rem;
        }

        .tag {
            display: inline-block;
            background-color: var(--accent-color);
            color: #fff;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-right: 6px;
        }

        .creator-text {
            color: var(--text-dim);
            font-size: 0.85rem;
            margin-top: 4px;
        }

        .action-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-direction: column;
        }

        @media (min-width: 600px) {
            .action-group {
                flex-direction: row;
            }
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: background-color 0.2s;
        }

        .btn-export {
            background-color: var(--export-btn-bg);
            color: #ffffff;
        }

        .btn-export:active {
            background-color: var(--export-btn-hover);
        }

        .btn-reset {
            background-color: #272a3d;
            color: #ffffff;
            border: 1px solid var(--border-color);
        }

        .btn-reset:active {
            background-color: #32364e;
        }

        .section-title {
            font-weight: 700;
            color: var(--accent-color);
            margin-top: 20px;
            margin-bottom: 8px;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .content-box {
            background-color: var(--box-bg);
            padding: 12px 14px;
            border-radius: 8px;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 0.9rem;
            line-height: 1.6;
            border: 1px solid var(--border-color);
            color: #e2e8f0;
        }

        .wi-entry {
            background-color: var(--box-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 12px;
            padding: 12px;
        }

        .wi-keys {
            color: var(--key-color);
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 8px;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">
        <h2>酒馆解析导出器</h2>
        <p>支持 PNG 角色卡 & JSON 世界书</p>
    </div>

    <div class="upload-area" id="dropZone">
        <div class="upload-icon">📁</div>
        <div class="upload-text">点击选择文件</div>
        <div class="upload-hint">支持 .png 角色卡 或 .json 世界书</div>
        
        <div class="file-tip-box">
            📱 <strong>手机端特别提醒：</strong><br>
            上传 PNG 角色卡时，请选择<b>“浏览/文件”</b>并从<b>手机内置文件管理器</b>选取。<br>
            ⚠️ <b>请勿直接从“系统相册/图库”选择</b>，相册会自动压缩图片并擦除隐藏的角色元数据！
        </div>

        <input type="file" id="fileInput" accept=".png,.json,image/png,application/json">
    </div>

    <div class="display-card" id="displayCard">
        <div class="header-profile">
            <img id="avatar" class="avatar" src="" alt="Avatar" style="display:none;">
            <div class="meta-info">
                <h1 id="charName">角色名称</h1>
                <div>
                    <span class="tag" id="cardTag">Tavern Card</span>
                    <div class="creator-text" id="charCreator"></div>
                </div>
            </div>
        </div>

        <div id="contentSections"></div>

        <div class="action-group">
            <button class="btn btn-export" id="exportBtn" onclick="exportZipPackage()">📦 导出嵌套 Zip 包</button>
            <button class="btn btn-reset" onclick="resetViewer()">解析其他文件</button>
        </div>
    </div>
</div>

<script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const displayCard = document.getElementById('displayCard');

    let parsedData = null; // 存储当前解析出的 JSON 数据
    let currentDataType = ''; // 'character' 或 'world'

    dropZone.addEventListener('click', () => fileInput.click());

    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, preventDefaults, false);
        document.body.addEventListener(eventName, preventDefaults, false);
    });

    function preventDefaults(e) {
        e.preventDefault();
        e.stopPropagation();
    }

    dropZone.addEventListener('drop', (e) => {
        const dt = e.dataTransfer;
        const files = dt.files;
        if (files.length) handleFile(files[0]);
    });

    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length) handleFile(e.target.files[0]);
    });

    function handleFile(file) {
        const fileName = file.name.toLowerCase();
        if (fileName.endsWith('.png') || file.type === 'image/png') {
            parsePngCard(file);
        } else if (fileName.endsWith('.json') || file.type === 'application/json') {
            parseJsonFile(file);
        } else {
            alert('不支持的文件格式！请选择 .png 图片或 .json 文件。');
        }
    }

    function safeBase64Decode(str) {
        try {
            return decodeURIComponent(escape(atob(str)));
        } catch (e) {
            try {
                const binaryStr = atob(str);
                const bytes = new Uint8Array(binaryStr.length);
                for (let i = 0; i < binaryStr.length; i++) {
                    bytes[i] = binaryStr.charCodeAt(i);
                }
                return new TextDecoder('utf-8').decode(bytes);
            } catch (err) {
                console.error("Base64 decode error:", err);
                return null;
            }
        }
    }

    function parsePngCard(file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const buffer = new Uint8Array(e.target.result);
            const dataView = new DataView(e.target.result);
            
            if (buffer[0] !== 0x89 || buffer[1] !== 0x50 || buffer[2] !== 0x4E || buffer[3] !== 0x47) {
                alert('读取失败：不是有效的 PNG 文件！');
                return;
            }

            let offset = 8;
            let metadataText = null;

            while (offset < buffer.length) {
                if (offset + 8 > buffer.length) break;
                
                const length = dataView.getUint32(offset);
                const type = String.fromCharCode(...buffer.slice(offset + 4, offset + 8));

                if (type === 'tEXt') {
                    const chunkData = buffer.slice(offset + 8, offset + 8 + length);
                    let nullIndex = -1;
                    for (let i = 0; i < chunkData.length; i++) {
                        if (chunkData[i] === 0) {
                            nullIndex = i;
                            break;
                        }
                    }

                    if (nullIndex !== -1) {
                        const keyword = new TextDecoder('utf-8').decode(chunkData.slice(0, nullIndex));
                        if (keyword === 'chara' || keyword === 'cchar') {
                            const base64Str = new TextDecoder('utf-8').decode(chunkData.slice(nullIndex + 1));
                            metadataText = safeBase64Decode(base64Str);
                            break;
                        }
                    }
                }
                offset += 12 + length;
            }

            if (metadataText) {
                try {
                    const jsonData = JSON.parse(metadataText);
                    const imageUrl = URL.createObjectURL(file);
                    currentDataType = 'character';
                    parsedData = jsonData.data || jsonData;
                    renderCharacterCard(parsedData, imageUrl);
                } catch (err) {
                    alert('数据解析错误：提取出的文字不是合法的 JSON 格式。');
                }
            } else {
                alert('未检测到角色卡数据！\n\n📱 手机用户请注意：\n请不要从“相册/图库”直接选择图片，相册会自动转码压缩并抹除元数据。请将图片存入手机“文件管理/下载”后再选择！');
            }
        };
        reader.readAsArrayBuffer(file);
    }

    function parseJsonFile(file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                if (data.entries) {
                    currentDataType = 'world';
                    parsedData = data;
                    renderWorldInfo(data);
                } else if (data.data || data.name || data.description) {
                    currentDataType = 'character';
                    parsedData = data.data || data;
                    renderCharacterCard(parsedData, null);
                } else {
                    alert('未知的 JSON 格式：未包含角色卡或世界书的标准结构。');
                }
            } catch (err) {
                alert('JSON 解析失败：该文件语法存在错误。');
            }
        };
        reader.readText(file);
    }

    function renderCharacterCard(data, imgUrl) {
        dropZone.style.display = 'none';
        displayCard.style.display = 'block';

        const avatarEl = document.getElementById('avatar');
        if (imgUrl) {
            avatarEl.src = imgUrl;
            avatarEl.style.display = 'block';
        } else {
            avatarEl.style.display = 'none';
        }

        document.getElementById('charName').innerText = data.name || '未命名角色';
        document.getElementById('cardTag').innerText = '角色卡 (Character)';
        document.getElementById('charCreator').innerText = data.creator ? `作者: ${data.creator}` : '';

        const fields = [
            ['说明 / 描述 (Description)', data.description],
            ['性格特征 (Personality)', data.personality],
            ['开场白 (First Message)', data.first_mes],
            ['角色设定 (Scenario)', data.scenario],
            ['对话示例 (Mes Example)', data.mes_example],
            ['系统提示词补丁 (Post History Instructions)', data.post_history_instructions]
        ];

        let html = '';
        fields.forEach(([label, content]) => {
            if (content && content.trim() !== '') {
                html += `<div class="section-title">📌 ${label}</div>`;
                html += `<div class="content-box">${escapeHtml(content)}</div>`;
            }
        });

        if (data.character_book && data.character_book.entries) {
            html += `<div class="section-title" style="margin-top: 30px; border-top: 1px dashed var(--border-color); padding-top: 15px; color: #10b981;">📚 卡内绑定世界书 (World Info)</div>`;
            const entries = Array.isArray(data.character_book.entries) 
                ? data.character_book.entries 
                : Object.values(data.character_book.entries);
            html += generateWorldInfoHtml(entries);
        }

        document.getElementById('contentSections').innerHTML = html;
        window.scrollTo(0, 0);
    }

    function renderWorldInfo(data) {
        dropZone.style.display = 'none';
        displayCard.style.display = 'block';

        document.getElementById('avatar').style.display = 'none';
        document.getElementById('charName').innerText = data.name || '独立世界书 (World Info)';
        document.getElementById('cardTag').innerText = '世界书 (World Info)';
        
        const entries = Array.isArray(data.entries) ? data.entries : Object.values(data.entries || {});
        document.getElementById('charCreator').innerText = `词条总数: ${entries.length}`;

        document.getElementById('contentSections').innerHTML = generateWorldInfoHtml(entries);
        window.scrollTo(0, 0);
    }

    function generateWorldInfoHtml(entries) {
        if (!entries || entries.length === 0) return '<div class="content-box">暂无词条内容</div>';
        
        let html = '';
        entries.forEach(entry => {
            const keysArray = entry.keys || entry.key || [];
            const keys = Array.isArray(keysArray) ? keysArray.join(', ') : keysArray;
            const content = entry.content || entry.entry || '';
            
            html += `
                <div class="wi-entry">
                    <div class="wi-keys">🔑 触发词: ${escapeHtml(keys || '无触发词')}</div>
                    <div class="content-box">${escapeHtml(content)}</div>
                </div>
            `;
        });
        return html;
    }

    // 核心导出逻辑：打包生成 Zip 架构
    async function exportZipPackage() {
        if (!parsedData) return;
        if (typeof JSZip === 'undefined') {
            alert('压缩组件正在加载中，请稍后再试');
            return;
        }

        const name = sanitizeFileName(parsedData.name || '未命名');
        const creator = sanitizeFileName(parsedData.creator || 'Unknown');
        const mainZipName = `${name} by ${creator}.zip`;

        const mainZip = new JSZip();

        // 1. 处理角色卡 TXT 导出的 Zip
        const charZip = new JSZip();
        let charTxtContent = `角色名称：${parsedData.name || ''}\n作者：${parsedData.creator || ''}\n\n`;
        charTxtContent += `========== 描述 (Description) ==========\n${parsedData.description || ''}\n\n`;
        charTxtContent += `========== 性格 (Personality) ==========\n${parsedData.personality || ''}\n\n`;
        charTxtContent += `========== 开场白 (First Message) ==========\n${parsedData.first_mes || ''}\n\n`;
        charTxtContent += `========== 设定 (Scenario) ==========\n${parsedData.scenario || ''}\n\n`;
        charTxtContent += `========== 对话示例 (Mes Example) ==========\n${parsedData.mes_example || ''}\n\n`;
        charTxtContent += `========== 系统提示词 (Post History Instructions) ==========\n${parsedData.post_history_instructions || ''}\n`;

        charZip.file(`${name}.txt`, charTxtContent);
        const charZipBlob = await charZip.generateAsync({ type: "blob" });
        mainZip.file(`${name}-角色设定.zip`, charZipBlob);

        // 2. 处理世界书的 Zip (包含 json 和 txt)
        const wiZip = new JSZip();
        let worldInfoData = null;

        if (currentDataType === 'world') {
            worldInfoData = parsedData;
        } else if (parsedData.character_book) {
            worldInfoData = parsedData.character_book;
        }

        if (worldInfoData) {
            // 世界书 JSON
            wiZip.file(`${name}.json`, JSON.stringify(worldInfoData, null, 2));

            // 世界书 TXT
            const entries = Array.isArray(worldInfoData.entries) ? worldInfoData.entries : Object.values(worldInfoData.entries || {});
            let wiTxtContent = `世界书: ${parsedData.name || '未命名'}\n\n`;
            entries.forEach((e, idx) => {
                const keysArray = e.keys || e.key || [];
                const keys = Array.isArray(keysArray) ? keysArray.join(', ') : keysArray;
                wiTxtContent += `[条目 ${idx + 1}]\n触发词: ${keys}\n内容:\n${e.content || e.entry || ''}\n-----------------------------------\n\n`;
            });

            wiZip.file(`${name}.txt`, wiTxtContent);
            const wiZipBlob = await wiZip.generateAsync({ type: "blob" });
            mainZip.file(`${name}-世界书.zip`, wiZipBlob);
        }

        // 打包最终的的大 ZIP 包并触发下载
        const finalBlob = await mainZip.generateAsync({ type: "blob" });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(finalBlob);
        a.download = mainZipName;
        a.click();
        URL.revokeObjectURL(a.href);
    }

    function sanitizeFileName(str) {
        return str.replace(/[\\/:*?"<>|]/g, '_').trim();
    }

    function resetViewer() {
        displayCard.style.display = 'none';
        dropZone.style.display = 'block';
        fileInput.value = '';
        document.getElementById('contentSections').innerHTML = '';
        parsedData = null;
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }
</script>

</body>
</html>
