<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>酒馆角色卡与世界书解析器</title>
    <style>
        :root {
            --bg-color: #1a1a24;
            --card-bg: #242438;
            --accent-color: #7289da;
            --text-color: #e1e1e6;
            --text-dim: #a0a0b0;
            --border-color: #383850;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        .upload-area {
            border: 2px dashed var(--accent-color);
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            background-color: var(--card-bg);
            cursor: pointer;
            margin-bottom: 20px;
            transition: all 0.2s ease;
        }

        .upload-area:hover {
            background-color: #2d2d48;
        }

        input[type="file"] {
            display: none;
        }

        .display-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 24px;
            border: 1px solid var(--border-color);
            display: none;
        }

        .header-profile {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        .avatar {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .meta-info h1 {
            margin: 0 0 10px 0;
            color: #fff;
        }

        .tag {
            display: inline-block;
            background-color: var(--accent-color);
            color: #fff;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            margin-right: 5px;
        }

        .section-title {
            font-weight: bold;
            color: var(--accent-color);
            margin-top: 20px;
            margin-bottom: 8px;
            text-transform: uppercase;
            font-size: 0.85em;
            letter-spacing: 1px;
        }

        .content-box {
            background-color: #1c1c2b;
            padding: 12px 16px;
            border-radius: 6px;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 0.95em;
            line-height: 1.5;
            border: 1px solid #2a2a3d;
        }

        .wi-entry {
            background-color: #1c1c2b;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            margin-bottom: 10px;
            padding: 12px;
        }

        .wi-keys {
            color: #43b581;
            font-weight: bold;
            font-size: 0.9em;
            margin-bottom: 6px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="upload-area" id="dropZone">
        <h3>拖拽 PNG 角色卡或 JSON 世界书到这里上传</h3>
        <p style="color: var(--text-dim); font-size: 0.9em;">也可以点击选择本地文件</p>
        <input type="file" id="fileInput" accept=".png,.json">
    </div>

    <div class="display-card" id="displayCard">
        <div class="header-profile">
            <img id="avatar" class="avatar" src="" alt="Avatar" style="display:none;">
            <div class="meta-info">
                <h1 id="charName">角色名称</h1>
                <div>
                    <span class="tag" id="cardVersion">V2</span>
                    <span style="color: var(--text-dim); font-size: 0.9em;" id="charCreator"></span>
                </div>
            </div>
        </div>

        <div id="contentSections"></div>
    </div>
</div>

<script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const displayCard = document.getElementById('displayCard');

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => e.preventDefault());
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length) handleFile(e.target.files[0]);
    });

    function handleFile(file) {
        if (file.name.endsWith('.png')) {
            parsePngCard(file);
        } else if (file.name.endsWith('.json')) {
            parseJsonFile(file);
        }
    }

    // 解析 PNG 角色卡中的 tEXt 隐写数据 (chara / cchar)
    function parsePngCard(file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const buffer = new Uint8Array(e.target.result);
            const dataView = new DataView(e.target.result);
            
            let offset = 8; // 跳过 PNG 头
            let metadataText = null;

            while (offset < buffer.length) {
                const length = dataView.getUint32(offset);
                const type = String.fromCharCode(...buffer.slice(offset + 4, offset + 8));

                if (type === 'tEXt') {
                    const chunkData = buffer.slice(offset + 8, offset + 8 + length);
                    const nullIndex = chunkData.indexOf(0);
                    const keyword = new TextDecoder().decode(chunkData.slice(0, nullIndex));
                    
                    if (keyword === 'chara' || keyword === 'cchar') {
                        const base64Str = new TextDecoder().decode(chunkData.slice(nullIndex + 1));
                        metadataText = decodeURIComponent(escape(atob(base64Str)));
                        break;
                    }
                }
                offset += 12 + length;
            }

            if (metadataText) {
                const jsonData = JSON.parse(metadataText);
                const imageUrl = URL.createObjectURL(file);
                renderCharacterCard(jsonData.data || jsonData, imageUrl);
            } else {
                alert('未在该 PNG 图片中找到酒馆角色卡元数据！');
            }
        };
        reader.readAsArrayBuffer(file);
    }

    // 解析纯 JSON 格式（世界书或角色卡）
    function parseJsonFile(file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                if (data.entries) {
                    renderWorldInfo(data);
                } else if (data.data || data.name) {
                    renderCharacterCard(data.data || data, null);
                } else {
                    alert('未知的 JSON 数据结构');
                }
            } catch (err) {
                alert('JSON 解析失败！');
            }
        };
        reader.readText(file);
    }

    // 渲染角色卡数据
    function renderCharacterCard(data, imgUrl) {
        displayCard.style.display = 'block';
        
        const avatarEl = document.getElementById('avatar');
        if (imgUrl) {
            avatarEl.src = imgUrl;
            avatarEl.style.display = 'block';
        } else {
            avatarEl.style.display = 'none';
        }

        document.getElementById('charName').innerText = data.name || '未命名角色';
        document.getElementById('charCreator').innerText = data.creator ? `作者: ${data.creator}` : '';

        const fields = [
            ['说明 / 描述 (Description)', data.description],
            ['性格特征 (Personality)', data.personality],
            ['开场白 (First Message)', data.first_mes],
            ['角色设定 (Scenario)', data.scenario],
            ['对话示例 (Mes Example)', data.mes_example],
            ['系统提示词补丁 (Post History Instructions)', data.post_history_instructions]
        ];

        let html = '';
        fields.forEach(([label, content]) => {
            if (content) {
                html += `<div class="section-title">${label}</div>`;
                html += `<div class="content-box">${escapeHtml(content)}</div>`;
            }
        });

        // 嵌套世界书处理
        if (data.character_book && data.character_book.entries) {
            html += `<div class="section-title" style="margin-top: 30px; border-top: 1px dashed var(--border-color); padding-top: 15px;">卡内集成世界书 (World Info)</div>`;
            html += generateWorldInfoHtml(data.character_book.entries);
        }

        document.getElementById('contentSections').innerHTML = html;
    }

    // 渲染独立世界书
    function renderWorldInfo(data) {
        displayCard.style.display = 'block';
        document.getElementById('avatar').style.display = 'none';
        document.getElementById('charName').innerText = data.name || '独立世界书 (World Info)';
        document.getElementById('charCreator').innerText = `词条数量: ${Object.keys(data.entries || {}).length}`;

        const entries = Array.isArray(data.entries) ? data.entries : Object.values(data.entries);
        document.getElementById('contentSections').innerHTML = generateWorldInfoHtml(entries);
    }

    function generateWorldInfoHtml(entries) {
        let html = '';
        entries.forEach(entry => {
            const keys = Array.isArray(entry.keys) ? entry.keys.join(', ') : (entry.key ? entry.key.join(', ') : '无触发词');
            const content = entry.content || entry.entry || '';
            
            html += `
                <div class="wi-entry">
                    <div class="wi-keys">🔑 触发词: ${escapeHtml(keys)}</div>
                    <div class="content-box" style="background-color: #141420;">${escapeHtml(content)}</div>
                </div>
            `;
        });
        return html;
    }

    function escapeHtml(str) {
        return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;") : '';
    }
</script>

</body>
</html>
